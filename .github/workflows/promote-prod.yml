name: promote-prod

on:
  workflow_dispatch:
    inputs:
      folderName:
        required: false
        description: "ArgoCD helm-values folder name. Defaults to repository name."
        type: string
        default: ''
      version:
        required: false
        description: "Version to promote. Leave blank to promote whatever is currently in stage."
        type: string
        default: ''
      reason:
        required: false
        description: "Why this is going out. Feeds the change fail rate and rework rate metrics."
        type: choice
        options:
          - planned
          - rollback
          - hotfix
        default: planned
      argoCdRepoName:
        required: false
        description: "ArgoCD repo name. Defaults to <owner>/argocd-shared."
        type: string
        default: ''
      environmentName:
        required: false
        description: "GitHub Environment supplying the main-only deployment-branch policy. Records nothing."
        type: string
        default: 'production'
      updateMigrationTag:
        required: false
        description: "Also update migrationJob.image.tag. Set false for services without migrations."
        type: boolean
        default: true
      dryRun:
        required: false
        description: "Validate and show the diff, but do not push or record a deployment."
        type: boolean
        default: false
      trainVersion:
        required: false
        description: "GitHub milestone title naming the release train, e.g. 20.4.3. Must match a milestone in THIS repository. When set, a release event is dispatched to innago-engineering-metrics so the deployment is stamped with the train. Leave blank for a promotion outside a train."
        type: string
        default: ''

  workflow_call:
    inputs:
      folderName:
        required: false
        description: "ArgoCD helm-values folder name. Defaults to repository name."
        type: string
        default: ''
      version:
        required: false
        description: "Version to promote. Leave blank to promote whatever is currently in stage."
        type: string
        default: ''
      reason:
        required: false
        description: "planned, rollback or hotfix. Feeds the change fail rate and rework rate metrics."
        type: string
        default: 'planned'
      argoCdRepoName:
        required: false
        description: "ArgoCD repo name. Defaults to <owner>/argocd-shared."
        type: string
        default: ''
      environmentName:
        required: false
        description: "GitHub Environment supplying the main-only deployment-branch policy. Records nothing."
        type: string
        default: 'production'
      updateMigrationTag:
        required: false
        description: "Also update migrationJob.image.tag. Set false for services without migrations."
        type: boolean
        default: true
      dryRun:
        required: false
        description: "Validate and show the diff, but do not push or record a deployment."
        type: boolean
        default: false
      trainVersion:
        required: false
        description: "GitHub milestone title naming the release train, e.g. 20.4.3. Must match a milestone in THIS repository. When set, a release event is dispatched to innago-engineering-metrics so the deployment is stamped with the train. Leave blank for a promotion outside a train."
        type: string
        default: ''

    secrets:
      githubToken:
        description: "Token with write access to the ArgoCD repo and read access to GHCR."
        required: true

concurrency:
  group: promote-prod-${{ inputs.folderName || github.event.repository.name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: resolve and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      folderName: ${{ steps.resolve.outputs.folderName }}
      version: ${{ steps.resolve.outputs.version }}
      currentProd: ${{ steps.resolve.outputs.currentProd }}
      imageRepository: ${{ steps.resolve.outputs.imageRepository }}
      isRollback: ${{ steps.resolve.outputs.isRollback }}
    steps:
      - name: checkout argocd repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ inputs.argoCdRepoName || format('{0}/argocd-shared', github.repository_owner) }}
          ref: main
          token: ${{ secrets.githubToken || github.token }}
          path: argocd

      - name: install yq
        uses: dcarbone/install-yq-action@4075b4dca348d74bd83f2bf82d30f25d7c54539b # v1.3.1

      - name: resolve version
        id: resolve
        shell: bash
        env:
          FOLDER: ${{ inputs.folderName }}
          REPO_NAME: ${{ github.event.repository.name }}
          VERSION: ${{ inputs.version }}
          REASON: ${{ inputs.reason }}
        run: |-
          set -euo pipefail

          case "${REASON}" in
            planned|rollback|hotfix) ;;
            *) echo "::error::reason must be one of: planned, rollback, hotfix. Got '${REASON}'."; exit 1 ;;
          esac

          folder="${FOLDER}"
          if [ -z "${folder}" ]; then folder="${REPO_NAME}"; fi
          folder=$(echo "${folder}" | tr '[:upper:]' '[:lower:]' | tr ' ' '-')

          # folderName is caller-supplied and decides which service's values file is
          # written. Without this check a repo could pass a path that resolves into
          # another service's folder and promote it, even though the environment
          # approval it passed belongs to its own repo. Every existing helm-values
          # folder matches this pattern.
          if [[ ! "${folder}" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "::error::folderName must be lowercase letters, numbers and hyphens only, starting with a letter or number. Got '${folder}'."
            exit 1
          fi

          prodFile="argocd/helm-values/${folder}/value-overrides-prod-eks.yaml"
          stageFile="argocd/helm-values/${folder}/value-overrides-stage.yaml"

          if [ ! -f "${prodFile}" ]; then
            echo "::error::No production values file at helm-values/${folder}/value-overrides-prod-eks.yaml. This service does not deploy to prod-eks."
            exit 1
          fi

          currentProd=$(yq '.image.tag' "${prodFile}")
          imageRepository=$(yq '.image.repository' "${prodFile}")

          if [ -z "${currentProd}" ] || [ "${currentProd}" = "null" ]; then
            echo "::error::Could not read .image.tag from ${prodFile}."
            exit 1
          fi

          version="${VERSION}"
          if [ -z "${version}" ]; then
            if [ ! -f "${stageFile}" ]; then
              echo "::error::No stage file for ${folder}, so there is no default version to promote. Pass a version explicitly."
              exit 1
            fi
            version=$(yq '.image.tag' "${stageFile}")
            echo "No version supplied. Promoting the version currently in stage: ${version}"
          fi

          if [ -z "${version}" ] || [ "${version}" = "null" ]; then
            echo "::error::Could not determine a version to promote."
            exit 1
          fi

          if [ "${currentProd}" = "${version}" ]; then
            echo "::error::Production is already running ${version}. Nothing to promote."
            exit 1
          fi

          isRollback=false
          oldest=$(printf '%s\n%s\n' "${currentProd}" "${version}" | sort -V | head -n 1)
          if [ "${oldest}" = "${version}" ]; then
            isRollback=true
            if [ "${REASON}" != "rollback" ]; then
              echo "::error::${version} is older than the current production version ${currentProd}. Re-run with reason 'rollback' if that is what you intend."
              exit 1
            fi
            echo "::warning::Rolling production back from ${currentProd} to ${version}."
          fi

          {
            echo "folderName=${folder}"
            echo "version=${version}"
            echo "currentProd=${currentProd}"
            echo "imageRepository=${imageRepository}"
            echo "isRollback=${isRollback}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "### Promotion request"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Service | \`${folder}\` |"
            echo "| Currently in production | \`${currentProd}\` |"
            echo "| Promoting to | \`${version}\` |"
            echo "| Reason | ${REASON} |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: verify the image exists
        shell: bash
        env:
          TOKEN: ${{ secrets.githubToken || github.token }}
          ACTOR: ${{ github.actor }}
          IMAGE: ${{ steps.resolve.outputs.imageRepository }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |-
          set -euo pipefail
          echo "${TOKEN}" | docker login ghcr.io --username "${ACTOR}" --password-stdin
          if ! docker manifest inspect "${IMAGE}:${VERSION}" > /dev/null 2>&1; then
            echo "::error::Image ${IMAGE}:${VERSION} was not found in the registry. Nothing to promote."
            exit 1
          fi
          echo "Found ${IMAGE}:${VERSION}"

  promote:
    name: promote to production
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The environment no longer records anything - deployment events come from
    # ArgoCD at sync time, not from this workflow (model v2 section 5.1). It is
    # kept solely for its deployment-branch policy, which restricts promotion to
    # `main` and is what stops a promotion being dispatched from a branch
    # carrying a tampered folderName. Do not remove it as dead code.
    environment:
      name: ${{ inputs.environmentName }}
    steps:
      - name: checkout argocd repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ inputs.argoCdRepoName || format('{0}/argocd-shared', github.repository_owner) }}
          ref: main
          token: ${{ secrets.githubToken || github.token }}
          path: argocd

      - name: install yq
        uses: dcarbone/install-yq-action@4075b4dca348d74bd83f2bf82d30f25d7c54539b # v1.3.1

      - name: write the image tag
        shell: bash
        env:
          FOLDER: ${{ needs.resolve.outputs.folderName }}
          VERSION: ${{ needs.resolve.outputs.version }}
          PREVIOUS: ${{ needs.resolve.outputs.currentProd }}
          REASON: ${{ inputs.reason }}
          ACTOR: ${{ github.actor }}
          UPDATE_MIGRATION_TAG: ${{ inputs.updateMigrationTag }}
          DRY_RUN: ${{ inputs.dryRun }}
          # Decides the branch: a train shares one, a lone promotion gets its own.
          TRAIN: ${{ inputs.trainVersion }}
        run: |-
          set -euo pipefail
          cd argocd

          git config user.name "${ACTOR}"
          git config user.email "<>"

          fileName="helm-values/${FOLDER}/value-overrides-prod-eks.yaml"
          # Deliberately NOT the automated/ prefix. argocd-shared auto-merges
          # ^automated/.* via an app that can bypass rulesets, which would skip the
          # CODEOWNERS review protecting helm-values/**/value-overrides-prod-eks.yaml.
          # promote/ leaves the PR for a code owner to approve.
          # A train is meant to arrive as one thing. Promoting five services on
          # train 20.4.3 used to open five argocd-shared pull requests, five
          # CODEOWNERS reviews, and five merges that could land hours apart --
          # at which point the "train" is five independent releases wearing the
          # same label.
          #
          # Keyed on the train instead, they share one branch and one PR. The
          # GitOps dispatcher still emits one deployment event per service,
          # because it iterates every changed values file in the merge rather
          # than assuming one file per commit.
          #
          # Without a train it stays per-service: a lone promotion has nothing
          # to batch with, and sharing a branch would only couple it to whatever
          # else happened to be promoting.
          if [ -n "${TRAIN}" ]; then
            branchName="promote/train-${TRAIN}"
          else
            branchName="promote/prod-${FOLDER}-${VERSION}"
          fi

          # value-overrides-prod-eks.yaml declares the tag as a YAML anchor
          # (`tag: &tag 1.2.3`) that is referenced elsewhere in the same file.
          # yq preserves it on scalar assignment, but assert that rather than trust it:
          # a yq upgrade that drops the anchor would silently break every prod file.
          anchorsBefore=$(grep -c 'tag: &tag' "${fileName}" || true)

          # Join the train if it has already left: a branch that exists is one
          # an earlier service on this train pushed, so this promotion is added
          # to it rather than starting a rival branch of the same name.
          #
          # Existence is the test, not "is there an open PR". A merged promotion
          # deletes its branch, so a surviving branch means the train has not
          # landed yet. If someone merges without deleting, the next promotion
          # on that train reopens it -- visible, and fixed by deleting the branch.
          if git ls-remote --exit-code --heads origin "${branchName}" >/dev/null 2>&1; then
            echo "Joining the existing ${branchName}."
            git fetch --quiet origin "${branchName}"
            git checkout -B "${branchName}" "origin/${branchName}"
          else
            git checkout -b "${branchName}"
          fi

          oldTag=$(yq '.image.tag' "${fileName}")
          yq --inplace ".image.tag=\"${VERSION}\"" "${fileName}"
          newTag=$(yq '.image.tag' "${fileName}")

          if [ "${newTag}" != "${VERSION}" ]; then
            echo "::error::Failed to set image.tag in ${fileName} (was '${oldTag}', now '${newTag}')."
            exit 1
          fi

          if [ "${UPDATE_MIGRATION_TAG}" = "true" ]; then
            oldMigration=$(yq '.migrationJob.image.tag' "${fileName}")
            if [ "${oldMigration}" = "null" ]; then
              echo "::error::updateMigrationTag is true but ${fileName} has no migrationJob.image.tag. Set updateMigrationTag to false for this service."
              exit 1
            fi
            yq --inplace ".migrationJob.image.tag=\"${VERSION}\"" "${fileName}"
            newMigration=$(yq '.migrationJob.image.tag' "${fileName}")
            if [ "${newMigration}" != "${VERSION}" ]; then
              echo "::error::Failed to set migrationJob.image.tag in ${fileName} (was '${oldMigration}', now '${newMigration}')."
              exit 1
            fi
          fi

          anchorsAfter=$(grep -c 'tag: &tag' "${fileName}" || true)
          if [ "${anchorsBefore}" -gt 0 ] && [ "${anchorsAfter}" -lt "${anchorsBefore}" ]; then
            echo "::error::The YAML anchor on image.tag was lost during the edit (${anchorsBefore} before, ${anchorsAfter} after). Aborting rather than pushing a broken values file."
            exit 1
          fi

          if [ "${DRY_RUN}" = "true" ]; then
            echo "Dry run. Nothing was pushed. This is the change that would have been committed:"
            git --no-pager diff -- "${fileName}"
            {
              echo "### Dry run — no changes pushed"
              echo ""
              echo '```diff'
              git --no-pager diff -- "${fileName}"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          git add "${fileName}"
          git commit --message "Promote ${FOLDER} to ${VERSION} (${REASON}, was ${PREVIOUS})"

          # Services on one train are promoted from their own repositories, so
          # five runs can reach this line at once. The `concurrency` group above
          # cannot serialise them: a group is scoped to the repository running
          # the workflow, and these are five different repositories.
          #
          # So the push races, and the loser rebases and tries again. Rebase,
          # not merge: each promotion touches one values file, so the commits
          # are independent and replaying is trivial. A conflict here means two
          # promotions of the SAME service, which is a real conflict and should
          # stop rather than be resolved automatically.
          pushed=false
          for attempt in 1 2 3 4 5; do
            if git push --set-upstream origin "${branchName}"; then
              pushed=true
              break
            fi
            echo "Push rejected, another service on this train got there first. Rebasing (attempt ${attempt})."
            git fetch --quiet origin "${branchName}" || true
            if ! git rebase "origin/${branchName}"; then
              git rebase --abort || true
              echo "::error::Could not rebase onto ${branchName}. That means another promotion of ${FOLDER} is already on this train. Resolve it by hand."
              exit 1
            fi
            sleep $(( attempt * 3 ))
          done

          if [ "${pushed}" != "true" ]; then
            echo "::error::Could not push ${branchName} after 5 attempts."
            exit 1
          fi

          if [ -n "${TRAIN}" ]; then
            echo "Pushed ${FOLDER} ${VERSION} onto train ${TRAIN} (${branchName})."
            echo "Every service on this train shares that branch, so they merge as one pull request and arrive together."
          else
            echo "Pushed ${branchName}. auto-pr will raise the pull request; a code owner must approve and merge it."
          fi

      # This workflow is the only place that knows the train. The GitOps
      # dispatcher that produces deployment events watches helm-values for a
      # changed image tag and sees nothing else, which is why every deployment
      # recorded so far carries train_version: null.
      #
      # Dispatched here rather than after the merge, deliberately: this step
      # runs while the promotion is still a pull request, so the release record
      # is on disk before the merge triggers the deployment dispatch that reads
      # it. Recording early costs nothing if the PR is never merged -- a release
      # row with no matching deployment is inert.
      - name: record the release train
        if: ${{ inputs.trainVersion != '' && !inputs.dryRun }}
        env:
          GH_TOKEN: ${{ secrets.githubToken }}
          FOLDER: ${{ needs.resolve.outputs.folderName }}
          VERSION: ${{ needs.resolve.outputs.version }}
          TRAIN: ${{ inputs.trainVersion }}
        # A failed dispatch must never fail a promotion that already landed.
        # The metric is downstream of the deploy, not a gate on it; ingest is
        # idempotent, so a missed event can be replayed by hand.
        continue-on-error: true
        run: |-
          set -uo pipefail

          # The train must be a milestone that actually exists in this
          # repository. A typo would otherwise sail through and land as its own
          # one-service train, quietly fragmenting every per-train figure --
          # the failure mode is a wrong number, not an error, so it is worth
          # one API call to rule out.
          number=$(gh api "repos/${GITHUB_REPOSITORY}/milestones?state=all&per_page=100" \
                     --jq "[.[] | select(.title == \"${TRAIN}\") | .number] | first" 2>/dev/null || echo "")

          if [ -z "${number}" ] || [ "${number}" = "null" ]; then
            echo "::warning::no milestone titled '${TRAIN}' in ${GITHUB_REPOSITORY}. Nothing recorded — create the milestone, then replay with the ingest-release workflow."
            echo "  milestones available:"
            gh api "repos/${GITHUB_REPOSITORY}/milestones?state=all&per_page=100" \
              --jq '.[].title' 2>/dev/null | sed 's/^/    /' || true
            exit 0
          fi

          # The raw title travels; innago-engineering-metrics normalises it.
          # The same train is written variously as "20.1.3" and
          # "KYC Self-Help & Underlying issues(20.1.3)", and normalising in one
          # place keeps those from becoming two trains.
          jq -n --arg svc "${FOLDER}" --arg tag "${VERSION}" \
                --arg title "${TRAIN}" --argjson num "${number}" \
                --arg sha "${GITHUB_SHA}" \
                --arg when "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{event_type:"release",
              client_payload:{service:$svc, artifact_tag:$tag,
                              milestone_title:$title, milestone_number:$num,
                              sha:$sha, timestamp:$when}}' \
          | gh api --method POST \
              /repos/${GITHUB_REPOSITORY_OWNER}/innago-engineering-metrics/dispatches \
              --input - \
          && echo "recorded ${FOLDER} ${VERSION} on milestone ${TRAIN} (#${number})" \
          || echo "::warning::could not dispatch the release event; replay it with the ingest-release workflow"
