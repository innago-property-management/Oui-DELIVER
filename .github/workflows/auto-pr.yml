name: auto-pr
on:
  workflow_call:
    secrets:
      token:
        description: "GitHub token with contents:read and pull-requests:write (fallback if app key not provided)"
        required: true
      auto_pr_private_key:
        description: "GitHub App PEM private key for bot identity (optional — uses token if not set)"
        required: false

# No concurrency block — auto-pr is only called via workflow_call from
# workflows that already have their own concurrency controls.

jobs:
  pull_request:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Create GitHub App Token
        env:
          auto_pr_private_key: ${{ secrets.auto_pr_private_key }}
        if: env.auto_pr_private_key != ''
        id: app_token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          app-id: ${{ vars.AUTO_PR_APP_ID }}
          private-key: ${{ secrets.auto_pr_private_key }}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ steps.app_token.outputs.token || secrets.token }}
          fetch-depth: 0
      - name: Fetch base branch for PR diff
        run: git fetch origin main --depth=1
      - name: Create PR if none exists
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || secrets.token }}
          AUTO_PR_DEVELOPER: ${{ github.actor }}
        run: |
          set -euo pipefail

          # Skip if PR already exists for this branch
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          if gh pr list --head "$branch" --json number --jq 'length' | grep -q '^[1-9]'; then
            echo "PR already exists for branch $branch, skipping."
            exit 0
          fi

          # Check head commit for wip:/draft: prefix (case-insensitive)
          draft_flag=""
          latest_commit=$(git log -1 --format=%s)
          if echo "$latest_commit" | grep -iqE '^(wip|draft):'; then
            draft_flag="--draft"
          fi

          commit_count=$(git rev-list --count origin/main..HEAD)
          if [ "$commit_count" -eq 1 ]; then
            pr_title="$latest_commit"
          else
            # Strip type prefix (e.g. feature/, fix/) then humanize
            pr_title=$(echo "$branch" | sed 's|.*/||' | sed 's/[-_]/ /g' | awk '{for(i=1;i<=NF;i++) $i=toupper(substr($i,1,1)) substr($i,2)}1')
          fi

          # Build PR body: template + developer attribution + commit log appended at the end
          tmp_body=$(mktemp)
          cat .github/pull_request_template.md > "$tmp_body"

          printf "\n\n## Developer\n- @%s\n" "$AUTO_PR_DEVELOPER" >> "$tmp_body"

          printf "\n\n## Commits\n" >> "$tmp_body"
          git log --format="- %s" origin/main..HEAD >> "$tmp_body"

          author_label="author:${AUTO_PR_DEVELOPER}"

          if ! gh pr create \
            --title "$pr_title" \
            --body-file "$tmp_body" \
            --base main \
            --label "$author_label" \
            $draft_flag 2>&1; then
            # Gracefully handle race condition where PR was created between our check and create
            if gh pr list --head "$branch" --json number --jq 'length' | grep -q '^[1-9]'; then
              echo "PR was created by another process, skipping."
              exit 0
            fi
            exit 1
          fi
