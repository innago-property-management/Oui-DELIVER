name: "Build DotNet"
description: "Builds a solution"
inputs:
  organization:
    description: 'GitHub organization for package registry'
    required: false
    default: 'innago-property-management'
  version:
    required: true
    description: "Version"
  minimumCoverage:
    required: false
    description: "Minimum code coverage percentage"
    default: "0"
  githubToken:
    required: true
    description: "Github Token for publish"
  
  testProjectPath:
    required: true
    description: "Test project discovery is from the solution if this is not set."
    default: "."
  disableAnalyzers:
    required: false
    default: "false"
    description: >-
      Pass -p:RunAnalyzersDuringBuild=false and friends to `dotnet build`. The
      Dockerfiles in these repos already build this way; the CI build step does not,
      so the same code is analysed on every run. Measured on merlin: 39.1s -> 21.0s
      for a clean rebuild (-46%). Only enable where analyzer findings are surfaced
      elsewhere (e.g. PR builds or a dedicated job), since this silences them here.
  generateCoverageReport:
    required: false
    default: "true"
    description: >-
      Run ReportGenerator and write the markdown summary. Costs ~37s on merlin and
      is pointless when minimumCoverage is 0 and nothing consumes the report.
  coverageFormats:
    required: false
    default: "cobertura,opencover"
    description: >-
      Formats for the XPlat Code Coverage collector. ReportGenerator below reads
      coverage.opencover.xml, so opencover must stay in the list if
      generateCoverageReport is true. Narrow to just 'opencover' to skip emitting
      a second report nobody reads.
  useMsBuildCoverage:
    required: false
    default: "false"
    description: >-
      Pass coverlet.msbuild's /p:CollectCoverage and /p:Threshold* properties to
      `dotnet test`. Only set this true for repos that actually reference the
      coverlet.msbuild package; without it those properties are inert but still
      cost real time (measured on merlin: 83s vs 59s for byte-identical output,
      because coverage there comes from coverlet.collector). Note that
      minimumCoverage is only ENFORCED when this is true - coverlet.collector
      does not read the /p:Threshold* properties.
  dotnet-version:
    required: false
    description: ".NET SDK version(s) to install - a multi-line string"
    default: |
      8.x
      9.x
      10.x
runs:
  using: "composite"
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
    - name: Cache NuGet packages
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
      with:
        path: ~/.nuget/packages        
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    - name: Build
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        MINIMUM_COVERAGE: ${{ inputs.minimumCoverage }}
        REPORTS_PATH: test/results
        TEST_PROJECT_PATH: "${{ inputs.testProjectPath }}"
        USE_MSBUILD_COVERAGE: "${{ inputs.useMsBuildCoverage }}"
        DISABLE_ANALYZERS: "${{ inputs.disableAnalyzers }}"
        COVERAGE_FORMATS: "${{ inputs.coverageFormats }}"
        GHCR_USER: ${{ github.actor }}
        GHCR_TOKEN: ${{ inputs.githubToken }}
        GITHUB_TOKEN: ${{ inputs.githubToken }}
        # NuGet auth via env var - no cleartext password storage needed
        # See: https://learn.microsoft.com/en-us/nuget/reference/nuget-config-file#packagesourcecredentials
        NuGetPackageSourceCredentials_github: "Username=${{ github.actor }};Password=${{ inputs.githubToken }}"
      run: |
        set -euo pipefail
        # Add GitHub Packages source idempotently (remove first so re-runs on
        # self-hosted or cached runners do not fail with "source already exists")
        if dotnet nuget list source | grep -q '^  github '; then
          dotnet nuget remove source github
        fi
        dotnet nuget add source \
          --name "github" \
          "https://nuget.pkg.github.com/${{ inputs.organization }}/index.json"
        
        dotnet restore
        # Analyzers are a large share of compile time and are already disabled in the
        # Dockerfiles. Opt in per repo rather than changing this for everyone.
        ANALYZER_ARGS=()
        if [ "${DISABLE_ANALYZERS}" = "true" ]; then
          ANALYZER_ARGS=(
            -p:RunAnalyzersDuringBuild=false
            -p:EnableNETAnalyzers=false
            -p:EnforceCodeStyleInBuild=false
            -p:AnalysisLevel=none
          )
        fi

        dotnet build --configuration Release --no-restore /p:Version="$VERSION" \
          ${ANALYZER_ARGS[@]+"${ANALYZER_ARGS[@]}"}
        # coverlet.msbuild properties, only when the repo opts in. They are a no-op
        # unless that package is referenced, and measurably slow when it is not.
        #
        # The two branches are coupled on purpose:
        #
        #   opted IN  - coverlet.msbuild instruments during the BUILD, so `dotnet test`
        #               must be allowed to run its own build pass. --no-build would
        #               silently produce no coverage.
        #   opted OUT - coverlet.collector instruments at RUNTIME via the data
        #               collector, so the assemblies produced by the `dotnet build`
        #               above are reusable as-is and the implicit second build is pure
        #               waste. Measured on merlin: that pass recompiled all 7 projects
        #               and cost ~80s of a ~280s step, because passing /p: properties
        #               here that were absent from `dotnet build` changes the project
        #               fingerprint and forces a FULL rebuild rather than an
        #               incremental one.
        MSBUILD_COVERAGE_ARGS=()
        BUILD_REUSE_ARGS=()
        if [ "${USE_MSBUILD_COVERAGE}" = "true" ]; then
          MSBUILD_COVERAGE_ARGS=(
            /p:CollectCoverage=true
            /p:Threshold="$MINIMUM_COVERAGE"
            /p:ThresholdType=line
            /p:ThresholdStat=total
          )
        else
          BUILD_REUSE_ARGS=(--no-build)
        fi

        dotnet test ${TEST_PROJECT_PATH} \
          --no-restore \
          --configuration Release \
          --test-adapter-path:. \
          --logger:"trx;LogFileName=test_results.trx" \
          ${BUILD_REUSE_ARGS[@]+"${BUILD_REUSE_ARGS[@]}"} \
          ${MSBUILD_COVERAGE_ARGS[@]+"${MSBUILD_COVERAGE_ARGS[@]}"} \
          --collect:"XPlat Code Coverage;Format=${COVERAGE_FORMATS}" \
          --results-directory="$REPORTS_PATH"
    - name: ReportGenerator
      if: ${{ inputs.generateCoverageReport == 'true' }}
      uses: im-open/code-coverage-report-generator@4a07a939910b02a25199c538778e8b38607dbcf5 # v5.0.0
      with:
        reports: '*/**/coverage.opencover.xml'
        reporttypes: 'Html;MarkdownSummary'
        assemblyfilters: '-xunit*;-Dapper;'
        classfilters: '+*'
        filefilters: '-Startup.cs;-Program.cs;-*.cshtml'
        verbosity: 'Warning'
        targetdir: 'test/results/coverage'
    - name: Output to markdown
      if: ${{ inputs.generateCoverageReport == 'true' && hashFiles('test/results/coverage/Summary.md') != '' }}
      shell: bash
      run: cat test/results/coverage/Summary.md >> $GITHUB_STEP_SUMMARY
    - name: Test Report
      uses: dorny/test-reporter@6e6a65b7a0bd2c9197df7d0ae36ac5cee784230c # v2.0.0
      if: ${{ hashFiles('test/results/test_results.trx') != '' }}
      with:
        name: dotnet tests
        path: "test/results/test_results.trx"
        reporter: dotnet-trx
